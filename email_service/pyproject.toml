[project]
name = "email-service"
version = "0.1.0"
description = "MCP server: guarded email sending via SMTP"
requires-python = ">=3.13"
# [SC-24] Supply chain: only the packages this server uses, with major versions
# pinned (mcp 2.x and fast-flights 3.x break this code); exact versions in uv.lock
dependencies = [
    "keyring>=25.0",
    "mcp[cli]>=1.14.0,<2",
]
