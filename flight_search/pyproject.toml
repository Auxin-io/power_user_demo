[project]
name = "flight-search"
version = "0.1.0"
description = "MCP server: flight search via Google Flights (read-only)"
requires-python = ">=3.13"
# [SC-24] Supply chain: only the packages this server uses, with major versions
# pinned (mcp 2.x and fast-flights 3.x break this code); exact versions in uv.lock
dependencies = [
    "fast-flights>=2.2,<3",
    "keyring>=25.0",
    "mcp[cli]>=1.14.0,<2",
]
